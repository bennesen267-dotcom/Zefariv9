name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: |
          zip=$(ls *.zip | head -n1)
          unzip -o "$zip" -d _src
          root=$(dirname "$(find _src -name build.gradle | head -n1)")
          cp -a "$root"/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Zefari
          path: build/libs/*.jar
